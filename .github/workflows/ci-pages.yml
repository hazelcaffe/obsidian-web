name: CI and GitHub Pages

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-pages-${{ github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        name: Check, test and build
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - uses: actions/cache@v4
              with:
                  path: .cache
                  key: obsidian-bundle-${{ hashFiles('scripts/obsidian.ts') }}
            - run: pnpm lint
            - run: pnpm typecheck
            - run: pnpm test
            - run: pnpm exec playwright-core install --with-deps chromium
            - name: Build and test root hosting
              run: |
                  pnpm build
                  pnpm test:e2e
            - name: Build and test the Pages subpath
              env:
                  BASE_PATH: /${{ github.event.repository.name }}/
              run: |
                  pnpm build
                  pnpm test:e2e
            - name: Upload static site
              if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
              uses: actions/upload-pages-artifact@v3
              with:
                  path: dist

    deploy:
        name: Deploy Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        needs: verify
        runs-on: ubuntu-24.04
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/configure-pages@v5
            - name: Deploy static site
              id: deployment
              uses: actions/deploy-pages@v4
